[project]
name = "mcp_logic"
version = "0.1.0"
description = "MCP server for logical reasoning using Prover9"
requires-python = ">=3.10"
# mcp is capped below 2: SDK 2.0 replaced the low-level Server's
# decorator handlers (@server.list_tools) with constructor on_* params, so
# an unpinned install resolves 2.x and the server dies at import with
# AttributeError. Lift the cap together with the port — see
# .planning/phases/mcp-v2-migration-plan.md
dependencies = ["mcp>=1.6,<2", "pydantic>=2.0.0", "pytest-asyncio"]

[project.optional-dependencies]
advisor = ["llama-cpp-python>=0.3.0", "huggingface-hub>=0.24.0"]
# Z3 gives arithmetic reasoning, which Prover9 has no theory for.
smt = ["z3-solver>=4.13"]

[project.scripts]
mcp_logic = "mcp_logic.server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_logic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest-cov>=7.1.0"]
